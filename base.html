<!DOCTYPE html>
<html>
  <head>
    <title>Virtual Art Gallery</title>
    <meta name="description" content="نمایشگاه مجازی آثار طراحی و دوخت لباس دانش‌آموزی">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      .gallery-actions {
        position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
        z-index: 2147483647; display: flex; align-items: center; justify-content: center;
        gap: 12px; max-width: calc(100vw - 24px); padding: 12px 14px;
        box-sizing: border-box; border-radius: 12px; background: rgba(25, 24, 21, .92);
        color: #fff; font-family: Arial, sans-serif; text-align: center;
        box-shadow: 0 2px 14px rgba(0,0,0,.35);
      }
      .gallery-actions .action-button {
        display: inline-flex; align-items: center; justify-content: center;
        min-height: 48px; padding: 11px 18px; border: 1px solid #d7c39a;
        border-radius: 8px; background: #f6f0e4; color: #27231d;
        font: 600 16px/1.35 Arial, sans-serif; cursor: pointer; white-space: nowrap;
        text-decoration: none; box-sizing: border-box;
      }
      .gallery-actions .action-button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
      .gallery-actions .action-help { font-size: 14px; line-height: 1.5; max-width: 245px; }
      @media (max-width: 600px) {
        .gallery-actions { display: none; }
        .gallery-actions {
          bottom: 8px; gap: 7px; padding: 8px; border-radius: 10px;
          flex-wrap: wrap; width: calc(100vw - 16px);
        }
        .gallery-actions .action-button {
          min-height: 44px; padding: 9px 12px; font-size: 14px; white-space: normal;
          flex: 1 1 0;
        }
        .gallery-actions .action-help {
          display: block; flex: 1 0 100%; max-width: none; font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <nav class="gallery-actions" aria-label="امکانات نمایشگاه">
      <button class="action-button" id="download-artwork" type="button">دانلود تصویر اثر</button>
      <a class="action-button survey-link" href="https://digiform.ir/wab710d2e6" target="_blank" rel="noopener noreferrer">شرکت در نظرسنجی</a>
      <span class="action-help">برای دانلود، اثر را روبه‌روی دوربین و در مرکز صفحه قرار دهید.</span>
    </nav>
    <script>
      document.getElementById('download-artwork').addEventListener('click', function (event) {
        event.preventDefault();
        event.stopPropagation();
        window.dispatchEvent(new CustomEvent('gallery-download-front-artwork'));
      });
    </script>
    <script inline-htmlify></script>
  </body>
</html>
